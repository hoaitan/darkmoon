<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Docs site fixture</title>
    <style>
      body {
        margin: 0;
        display: flex;
        background: #ffffff;
        color: #202124;
        font-family: sans-serif;
      }
      nav {
        width: 180px;
        background: #fafafa;
        border-right: 1px solid #e5e5e5;
        padding: 16px;
        min-height: 100vh;
      }
      nav a {
        display: block;
        color: #444;
        text-decoration: none;
        margin-bottom: 8px;
      }
      main {
        padding: 24px;
        max-width: 640px;
      }
      code,
      pre {
        background: #f0f0f0;
        border-radius: 4px;
        padding: 2px 6px;
        font-family: monospace;
      }
      pre {
        padding: 12px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="#">Getting started</a>
      <a href="#">API reference</a>
      <a href="#">Guides</a>
    </nav>
    <main>
      <h1>Documentation fixture</h1>
      <p>Represents a docs site with sidebar nav and code blocks — a common layout shape.</p>
      <pre><code>const darkmoon = "on";</code></pre>
    </main>
  </body>
</html>
