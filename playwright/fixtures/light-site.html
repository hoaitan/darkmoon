<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Static light site fixture</title>
    <style>
      body {
        margin: 0;
        background: #ffffff;
        color: #1a1a1a;
        font-family: sans-serif;
      }
      header {
        background: #f2f2f2;
        padding: 24px;
        border-bottom: 1px solid #ddd;
      }
      main {
        padding: 24px;
        max-width: 640px;
      }
      .card {
        background: #f7f7f7;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
      }
      a {
        color: #1a56db;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>A plain static website</h1>
    </header>
    <main>
      <p>This fixture represents a simple, mostly-static light-background website — the baseline case.</p>
      <div class="card">Some card content with a light background.</div>
      <p><a href="#">A link</a> to make sure link colors survive the filter.</p>
    </main>
  </body>
</html>
