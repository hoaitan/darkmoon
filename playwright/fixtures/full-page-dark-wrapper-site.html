<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Full-page dark app-wrapper fixture</title>
    <style>
      /* body/html deliberately have NO explicit background of their own —
         mirrors real SPA shells (e.g. abc.net.au) where all the actual
         theming lives on an inner #app-wrapper div, not body/html. */
      body {
        margin: 0;
        font-family: sans-serif;
        color: #eee;
      }
      /* Covers ~all of the page — a root app-shell wrapper, NOT a small
         widget. DAR-17: this used to get misclassified as an already-dark
         "island" (it does have an opaque dark background), which stopped
         island scanning from descending any further and left every image
         on the page un-dimmed/un-corrected — see classifyAndMark's
         isTooLargeToBeIsland guard in islands.ts. */
      #app-wrapper {
        background: #1a1a1a;
        min-height: 100vh;
        padding: 24px;
        box-sizing: border-box;
      }
      img {
        display: block;
        width: 240px;
        height: 120px;
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <div id="app-wrapper">
      <h1>A full-page app shell with its own dark background</h1>
      <p>
        The wrapper covers the whole page, but the page itself should still be treated as needing the normal filter —
        this isn't a small embedded widget.
      </p>
