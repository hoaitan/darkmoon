<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Already-dark site fixture</title>
    <style>
      body {
        margin: 0;
        background: #121212;
        color: #e8e8e8;
        font-family: sans-serif;
      }
      main {
        padding: 24px;
        max-width: 640px;
      }
      .card {
        background: #1e1e1e;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>A site that ships its own dark theme</h1>
      <div class="card">Darkmoon should detect this background is already dark and skip filtering entirely.</div>
    </main>
  </body>
</html>
